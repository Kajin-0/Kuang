name: Kuang checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Project-local test scratch
        run: |
          mkdir -p .local/phase11/tmp
          echo "TMPDIR=$PWD/.local/phase11/tmp" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$PWD/.local/phase11/pip-cache" >> "$GITHUB_ENV"
      - name: Unit and adapter contract tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: CLI vertical slice
        run: |
          python -m kuang demo --seed 7 --out-dir out
          python -m kuang validate out/demo.kuang.json
          python -m kuang propose out/demo.kuang.json out/request.json --track track-arp --clip clip-arp-hook-a
          python -m kuang apply out/demo.kuang.json out/request.json out/edited.kuang.json --receipt out/receipt.json
          python -m kuang undo out/edited.kuang.json out/receipt.json out/restored.kuang.json
          cmp out/demo.kuang.json out/restored.kuang.json
          python -m kuang redo out/restored.kuang.json out/receipt.json out/redone.kuang.json
          cmp out/edited.kuang.json out/redone.kuang.json
      - name: Offline prompt workflow (no models or host downloads)
        run: |
          python -m kuang create "dark trap, 140 bpm, A minor" --out-dir out/trap --seed 17
          python -m kuang create "uplifting house, 126 bpm, C major" --out-dir out/house --seed 29
          python -m kuang create "ambient cinematic, 72 bpm, D minor" --out-dir out/ambient
          python -m kuang validate out/trap/project.kuang.json
          python -m kuang validate out/house/project.kuang.json
          python -m kuang validate out/ambient/project.kuang.json
      - name: Iterative revision and exact compound replay
        run: |
          python -m kuang revise out/trap "make the bass more aggressive, simplify the drums in Main, keep everything else unchanged" --plan-only > out/revision-plan.json
          python -m kuang revise out/trap --plan out/revision-plan.json --out-dir out/trap-revised
          python -m kuang undo out/trap-revised/project.kuang.json out/trap-revised/revision-receipt.json out/revision-undone.kuang.json
          cmp out/trap/project.kuang.json out/revision-undone.kuang.json
          python -m kuang redo out/revision-undone.kuang.json out/trap-revised/revision-receipt.json out/revision-redone.kuang.json
          cmp out/trap-revised/project.kuang.json out/revision-redone.kuang.json
          python -m kuang revise out/trap-revised "make the lead reverb wetter, turn the lead down by 2 dB" --out-dir out/trap-revised-again
      - name: Refined house production and deterministic export
        run: |
          python -m kuang create "uplifting house, 126 bpm, C major, 16 bars" --production refined --seed 29 --out-dir out/refined-a
          python -m kuang create "uplifting house, 126 bpm, C major, 16 bars" --production refined --seed 29 --out-dir out/refined-b
          python -m kuang validate out/refined-a/project.kuang.json
          cmp out/refined-a/project.kuang.json out/refined-b/project.kuang.json
          cmp out/refined-a/song.mid out/refined-b/song.mid
      - name: House pocket experiment (no external plugin or host required)
        run: |
          python tools/phase5_house.py --symbolic --seed 29 --out-dir out/pocket-a
          python tools/phase5_house.py --symbolic --seed 29 --out-dir out/pocket-b
          python -m kuang validate out/pocket-a/project.kuang.json
          cmp out/pocket-a/project.kuang.json out/pocket-b/project.kuang.json
          cmp out/pocket-a/song.mid out/pocket-b/song.mid
      - name: Exact-pocket depth experiment (no external plugin or host required)
        run: |
          python tools/phase6_house.py --symbolic --out-dir artifacts/phase6-house/ci-a
          python tools/phase6_house.py --symbolic --out-dir artifacts/phase6-house/ci-b
          python -m kuang validate artifacts/phase6-house/ci-a/project.kuang.json
          cmp artifacts/phase6-house/ci-a/project.kuang.json artifacts/phase6-house/ci-b/project.kuang.json
          cmp artifacts/phase6-house/ci-a/song.mid artifacts/phase6-house/ci-b/song.mid
      - name: Authored 64-bar song and separate source SongSpec
        run: |
          python tools/phase7_house.py pads --symbolic --out-dir artifacts/phase7-house/pad-fix
          python tools/phase7_house.py song --symbolic --source artifacts/phase7-house/pad-fix --out-dir artifacts/phase7-house/song-a
          python tools/phase7_house.py song --symbolic --out-dir artifacts/phase7-house/song-b
          python -m kuang validate artifacts/phase7-house/song-a/project.kuang.json
          cmp artifacts/phase7-house/song-a/project.kuang.json artifacts/phase7-house/song-b/project.kuang.json
          cmp artifacts/phase7-house/song-a/song.mid artifacts/phase7-house/song-b/song.mid
      - name: Audible gesture experiment (symbolic, deterministic, no downloads)
        run: |
          python tools/phase8_house.py --symbolic --out-dir .local/phase11/gestures-a
          python tools/phase8_house.py --symbolic --out-dir .local/phase11/gestures-b
          python -m kuang validate .local/phase11/gestures-a/project.kuang.json
          cmp .local/phase11/gestures-a/project.kuang.json .local/phase11/gestures-b/project.kuang.json
          cmp .local/phase11/gestures-a/song.mid .local/phase11/gestures-b/song.mid
      - name: Translation mix and standalone loudness/master imports
        run: |
          python tools/phase9_house.py --symbolic --out-dir .local/phase11/translation-a
          python tools/phase9_house.py --symbolic --out-dir .local/phase11/translation-b
          python -m kuang validate .local/phase11/translation-a/project.kuang.json
          cmp .local/phase11/translation-a/project.kuang.json .local/phase11/translation-b/project.kuang.json
          cmp .local/phase11/translation-a/song.mid .local/phase11/translation-b/song.mid
      - name: Pad-space and pruned sine pulse (deterministic, no host or model)
        run: |
          python tools/phase10_house.py --symbolic --out-dir .local/phase11/atmosphere-a
          python tools/phase10_house.py --symbolic --out-dir .local/phase11/atmosphere-b
          python -m kuang validate .local/phase11/atmosphere-a/project.kuang.json
          cmp .local/phase11/atmosphere-a/project.kuang.json .local/phase11/atmosphere-b/project.kuang.json
          cmp .local/phase11/atmosphere-a/song.mid .local/phase11/atmosphere-b/song.mid
      - name: Original external-synth patches without a plugin dependency
        run: |
          python -m kuang.external_synth --help
          python -c 'from kuang.vitalium_patch import original_patch, component, vstpreset, chunks; p=original_patch("pad"); assert p==original_patch("pad"); assert chunks(vstpreset(component(p)))[b"Comp"]==component(p)'
      - name: Wheel install and installed profiles/loudness/master smoke
        run: |
          mkdir -p .local/phase11/build-src
          cp pyproject.toml LICENSE .local/phase11/build-src/
          cp -r kuang .local/phase11/build-src/
          # The image's cached 3.11 has setuptools/wheel; 3.13 omits them.
          # Build the universal wheel without fetching packages, then install
          # and run it with the selected matrix interpreter below.
          phase11_builder=("$RUNNER_TOOL_CACHE"/Python/3.11.*/x64/bin/python)
          test -x "${phase11_builder[0]}"
          "${phase11_builder[0]}" -m pip wheel --no-index --no-deps --no-build-isolation .local/phase11/build-src --wheel-dir .local/phase11/wheels
          python -m venv .local/phase11/install
          .local/phase11/install/bin/pip install --no-index --no-deps .local/phase11/wheels/*.whl
          mkdir -p .local/phase11/away
          cd .local/phase11/away
          ../install/bin/python -c 'from kuang.depth import depth_house; from kuang.schema import validate; validate(depth_house())'
          ../install/bin/python -c 'from kuang.house_song import arrange_house; from kuang.schema import validate; p=arrange_house(); validate(p); assert p.bars==64'
          ../install/bin/python -c 'from kuang.gestures import gesture_house; from kuang.schema import validate; p=gesture_house(); validate(p); assert p.bars==64'
          ../install/bin/python -c 'from kuang.translation import translation_house; from kuang.schema import validate; from kuang.loudness import k_coefficients; from kuang.mastering import validate_recipe; p=translation_house(); validate(p); assert p.bars==64; k_coefficients(48000)'
          ../install/bin/python -c 'from kuang.atmosphere import atmosphere_house; from kuang.schema import validate; p=atmosphere_house(); validate(p); assert p.bars==64; assert len(p.tracks)==11'
          ../install/bin/python -c 'from kuang.vitalium_patch import original_patch,component,vstpreset,chunks; from kuang.external_synth import ExternalSynthAdapter; p=original_patch("bass"); assert chunks(vstpreset(component(p)))[b"Comp"]==component(p)'
          ../install/bin/python -m kuang.external_synth --help
          ../install/bin/kuang --help
